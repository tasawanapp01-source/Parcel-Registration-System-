name: Deploy Student Parcel System to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

# กำหนดสิทธิ์สำหรับใช้ GitHub Pages Action
permissions:
  contents: read
  pages: write
  id-token: write

# ป้องกันการรัน Deploy ซ้อนกันหลายชุดในเวลาเดียว
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Source Code
        uses: actions/checkout@v4

      - name: 2. Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 3. Setup Bun Runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 4. Install Dependencies
        run: |
          if [ -f "bun.lock" ] || [ -f "bun.lockb" ]; then
            bun install
          elif [ -f "package-lock.json" ]; then
            npm ci --legacy-peer-deps || npm install --legacy-peer-deps
          else
            npm install --legacy-peer-deps
          fi

      - name: 5. Build Production Bundle (Vite + React + Tailwind)
        run: |
          npm run build
          touch dist/.nojekyll
          cp dist/index.html dist/404.html

      - name: 6. Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: 7. Upload Build Artifact (dist/)
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 8. Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
